[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cholec80-dl"
version = "0.3.0"
description = "Modern PyTorch pipelines for the Cholec80 surgical-video dataset: EndoNet (phase + tool), SlowFast (clip), CycleGAN (domain transfer), active learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Instrument detection/segmentation (GroundingDINO + SAM) only
seg = ["transformers>=4.40", "accelerate>=0.30"]
dev = ["pytest>=8.0"]
# Optional extras used by experiment scripts
plot = ["matplotlib>=3.7"]
log = ["tensorboard>=2.15"]

[tool.setuptools.packages.find]
include = ["cholec80_dl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
